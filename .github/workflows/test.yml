name: Run Unit Tests

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Dependencies for python-ldap
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc build-essential python3-dev libldap2-dev libsasl2-dev

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install "setuptools>=65,<82"
          pip install -r requirements_make_docs.txt

      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
