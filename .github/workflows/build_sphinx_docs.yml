# This is a basic workflow to help you get started with Actions

name: Build-sphinx-docs

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  # push:
  #  branches: [ master ]
  pull_request:
    branches: [ dev ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Несколько pull request публикуют одну и ту же ветку gh-pages.
# Параллельные push отклоняются: ref уже сдвинут другим запуском.
concurrency:
  group: gh-pages
  cancel-in-progress: false

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
           python-version: "3.12"
      # Runs a single command using the runners shell
      - name: Dependencies for python-ldap
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc build-essential python3-dev libldap2-dev libsasl2-dev tox lcov valgrind

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools>=65,<82"
          pip install -r requirements_make_docs.txt
      - name: Build HTML
        run: |
          python -m sphinx -b html docs/source docs/build
      - name: Run ghp-import
        run: |
          set -eu
          attempt=1
          max_attempts=5
          while true; do
            # ghp-import берёт родителя из origin/gh-pages и не делает fetch сам.
            git fetch origin '+refs/heads/gh-pages:refs/remotes/origin/gh-pages' || true
            if ghp-import -n -p -f docs/build; then
              exit 0
            fi
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "Не удалось опубликовать ветку gh-pages после ${max_attempts} попыток." >&2
              exit 1
            fi
            echo "Ветка gh-pages изменилась во время публикации, повтор ${attempt}." >&2
            attempt=$((attempt + 1))
            sleep $((attempt * 2))
          done
