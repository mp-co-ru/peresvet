# MCP Grafana. Файл копирует скрипт запуска, когда --mcp-grafana true.
# Имя контейнера в переменной: nginx стартует и без этого контейнера.

location = /mcp/grafana {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    set $mcp_grafana mcp_grafana;
    proxy_pass http://$mcp_grafana:8000/mcp$is_args$args;
}

location = /mcp/grafana/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    set $mcp_grafana mcp_grafana;
    proxy_pass http://$mcp_grafana:8000/mcp$is_args$args;
}
