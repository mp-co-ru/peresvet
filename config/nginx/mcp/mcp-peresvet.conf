# MCP платформы. Файл копирует скрипт запуска, когда --mcp-peresvet true.
# Имя контейнера в переменной: nginx стартует и без этого контейнера.

location = /mcp/peresvet {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    set $mcp_peresvet mcp_peresvet;
    proxy_pass http://$mcp_peresvet:8000/mcp$is_args$args;
}

location = /mcp/peresvet/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    set $mcp_peresvet mcp_peresvet;
    proxy_pass http://$mcp_peresvet:8000/mcp$is_args$args;
}

location = /mcp/peresvet/health {
    set $mcp_peresvet mcp_peresvet;
    proxy_pass http://$mcp_peresvet:8000/health;
}
